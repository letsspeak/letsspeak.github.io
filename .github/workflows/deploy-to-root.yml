name: Deploy to Root

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Deploy to root
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # ビルド成果物をリポジトリ直下に配置（ソースはそのまま残す）
        cp -r dist/* .
        cp dist/.nojekyll .
        rm -rf dist node_modules

        git add .
        git commit -m "Deploy to GitHub Pages root" || exit 0
        git push
